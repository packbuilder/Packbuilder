name: ci

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - 
        name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install EF Core CLI
        run: |
          dotnet tool install --global dotnet-ef \
            --version 10.0.0

      - name: Restore
        run: dotnet restore src/Packbuilder/Packbuilder.csproj

      - name: Generate migrations bundle
        run: |
          mkdir -p artifacts

          dotnet ef migrations bundle \
            --project src/Packbuilder/Packbuilder.csproj \
            --startup-project src/Packbuilder/Packbuilder.csproj \
            --self-contained \
            --target-runtime linux-x64 \
            --output artifacts/efbundle \
            --force
      
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      -
        name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/packbuilder/goob-hub/packbuilder:latest
        
      -
        name: Build and push migrations image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.migrations
          push: true
          tags: |
            ghcr.io/packbuilder/goob-hub/packbuilder-migrations:latest
            ghcr.io/packbuilder/goob-hub/packbuilder-migrations:${{ github.sha }}